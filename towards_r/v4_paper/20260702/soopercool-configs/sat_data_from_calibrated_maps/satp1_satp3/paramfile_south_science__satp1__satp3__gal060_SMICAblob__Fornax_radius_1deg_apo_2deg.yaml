    beam_dir: /scratch/gpfs/SIMONSOBS/sat-iso/beams/planets/20260602_bessel_analytic_cov_effective_v4_paper_20260520_science/
    map_template: "satp3_f090_science_bundle{id_bundle}_{map|hits}_calibrated.fits"
    beam_file: "satp3_science_v4_paper_f090.dat"
    n_bundles: 4          # Number of bundles
    freq_tag: 090         # Freq. tag (e.g. useful to coadd freqs)
    exp_tag: "satp3"      # Experiment tag (useful to get noise-bias free cross-split spectra)
    filtering_tag: "satp3_f090_south_science"
    kspace_tag: null
    hits_tag: "satp3_f090_south_science"
  satp3_f150_south_science:
