####################
# Masking metadata #
####################
masks:
  # Specify coordinates if using a rectangular mask
  box_mask: null
  # Set to True if mask is calculated from the weights,
  # otherwise set to False to use the hits
  use_weights: False
  analysis_mask: !path [*out_dir, masks/analysis_mask.fits]
  # When specifying this file, the mapset/bundle-specific hits files will
  # be ignored and instead a global hits file will be used (testing puroposes)
  global_hits: null
  # Path to products (binary)
  galactic_mask:  !path [*inputs_dir, masks/GAL_masks_binary/mask_gal060_coords_c_sat_f090_geometry_SMICAblob.fits]
  point_source_mask: /scratch/gpfs/SIMONSOBS/external_data_e2e/masks/ps_mask_with_PCCS2_030_G240.09-56.90_binary_1.0deg_radius.fits
  point_source_catalog: null
  external_mask: null
  # Apodization details
  apod_radius: 10.0
  smoothing_radius: 10.0
  apod_radius_point_source: 2.0
  apod_type: "C1"

####################################
# Metadata related to the analysis #
####################################
## General parameters
general_pars:
  pix_type: car
  car_template: /scratch/gpfs/SIMONSOBS/so/science-readiness/geometry/sat_f090.fits
  nside: 512
  lmin: 2
  lmax: 803
  binning_file: /scratch/gpfs/SIMONSOBS/sat-iso/v4/spectra/satp1/south/20251216_full-dataset/science/binning/binning_car_lmax2700_deltal15.npz
  pure_B: False
  # Where the beam window is lower than beam_floor, set it to beam_floor
  beam_floor: 1.e-2
  compute_Dl: True

covariance:
  hits_files:
    satp1_f090_south_science: /scratch/gpfs/SIMONSOBS/sat-iso/v4_paper/bundling/satp1_20260702_full-dataset/south/satp1_f090_science_hits.fits
    satp1_f150_south_science: /scratch/gpfs/SIMONSOBS/sat-iso/v4_paper/bundling/satp1_20260702_full-dataset/south/satp1_f150_science_hits.fits
    satp3_f090_south_science: /scratch/gpfs/SIMONSOBS/sat-iso/v4_paper/bundling/satp3_20260702/south/satp3_f090_science_hits.fits
    satp3_f150_south_science: /scratch/gpfs/SIMONSOBS/sat-iso/v4_paper/bundling/satp3_20260702/south/satp3_f150_science_hits.fits
  cov_num_sims: 200
  fiducial_cmb: null
  fiducial_dust: null
  fiducial_synch: null

transfer_settings:
  transfer_directory: !path [*out_dir, transfer_functions]
  # For estimation
  ## Number of sims for tf estimation
  tf_est_num_sims: 20
  sim_id_start: 0
  
  ## Path to the sims for TF estimation
  unfiltered_map_dir:
    satp1_f090_south_science: /scratch/gpfs/SIMONSOBS/sat-iso/v4/transfer_function/input_sims/
    satp1_f150_south_science: /scratch/gpfs/SIMONSOBS/sat-iso/v4/transfer_function/input_sims/
    satp3_f090_south_science: /scratch/gpfs/SIMONSOBS/sat-iso/v4/transfer_function/input_sims/
    satp3_f150_south_science: /scratch/gpfs/SIMONSOBS/sat-iso/v4/transfer_function/input_sims/
  unfiltered_map_template:
    satp1_f090_south_science: "{pure_type}_4.0arcmin_fwhm30.0_sim{id_sim:04d}_CAR.fits"
    satp1_f150_south_science: "{pure_type}_4.0arcmin_fwhm30.0_sim{id_sim:04d}_CAR.fits"
    satp3_f090_south_science: "{pure_type}_4.0arcmin_fwhm30.0_sim{id_sim:04d}_CAR.fits"
    satp3_f150_south_science: "{pure_type}_4.0arcmin_fwhm30.0_sim{id_sim:04d}_CAR.fits"
  filtered_map_dir:
    satp1_f090_south_science: /scratch/gpfs/SIMONSOBS/sat-iso/v4_paper/transfer_function/satp1/south/f090/20260702_full-dataset/coadded_sims
    satp1_f150_south_science: /scratch/gpfs/SIMONSOBS/sat-iso/v4_paper/transfer_function/satp1/south/f150/20260702_full-dataset/coadded_sims
    satp3_f090_south_science: /scratch/gpfs/SIMONSOBS/sat-iso/v4_paper/transfer_function/satp3_20260702/south/f090/full-dataset/coadded_sims
    satp3_f150_south_science: /scratch/gpfs/SIMONSOBS/sat-iso/v4_paper/transfer_function/satp3_20260702/south/f150/full-dataset/coadded_sims
  filtered_map_template:
    satp1_f090_south_science: "{pure_type}_1.0arcmin_fwhm30.0_sim{id_sim:04d}_CAR_bundle0_f090_science_filtered.fits"
    satp1_f150_south_science: "{pure_type}_1.0arcmin_fwhm30.0_sim{id_sim:04d}_CAR_bundle0_f150_science_filtered.fits"
    satp3_f090_south_science: "{pure_type}_1.0arcmin_fwhm30.0_sim{id_sim:04d}_CAR_bundle0_f090_science_filtered.fits"
    satp3_f150_south_science: "{pure_type}_1.0arcmin_fwhm30.0_sim{id_sim:04d}_CAR_bundle0_f150_science_filtered.fits"
