## General parameters
general_pars:
  pix_type: car
  car_template: /scratch/gpfs/SIMONSOBS/so/science-readiness/geometry/sat_f090.fits
  nside: 512
  lmin: 2
  lmax: 600  #803
  binning_file: /scratch/gpfs/SIMONSOBS/sat-iso/v4/spectra/satp1/south/20251216_full-dataset/science/binning/binning_car_lmax2700_deltal15.npz
  pure_B: False
  # Where the beam window is lower than beam_floor, set it to beam_floor
  beam_floor: 1.e-2
  compute_Dl: True

covariance:
  apply_filtering_corr: False
  hits_files:
    satp1_f090_south_science: /scratch/gpfs/SIMONSOBS/sat-iso/v4_paper/bundling/satp1_20260702_full-dataset/south/satp1_f090_science_hits.fits
