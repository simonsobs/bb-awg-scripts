####################
# Masking metadata #
####################
masks:
  # Specify coordinates if using a rectangular mask
  box_mask: null
  # Set to True if mask is calculated from the weights,
  # otherwise set to False to use the hits
  use_weights: False
  analysis_mask: /scratch/gpfs/SIMONSOBS/external_data_e2e/v4_paper/spectra_20260702/south/science/sat_data_from_calibrated_maps/satp1__satp3/analysis_mask_satp1_satp3__gal060_SMICAblob__Fornax_radius_1deg_apo_2deg/masks/analysis_mask.fits
  # When specifying this file, the mapset/bundle-specific hits files will
  # be ignored and instead a global hits file will be used (testing puroposes)
  global_hits: null
  # Path to products (binary)
  galactic_mask:  null
  point_source_catalog: null
  point_source_mask: null
  external_mask: null
  # Apodization details
  apod_radius: null
  smoothing_radius: null
  apod_radius_point_source: null
  apod_type: null

